<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · RWP Console</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d10; --s1: #12151a; --line: #262b33; --ink: #e8eaee; --ink2: #a3a9b4; --accent: #7c8cff; --crit: #f07a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 18px; }
  p { margin: 0; color: var(--ink2); font-size: 13px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink2); }
  input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: inherit; padding: 9px 11px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #0b0d10; border: 0; border-radius: 8px; padding: 10px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  .err { color: var(--crit); display: none; }
  .err.on { display: block; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>RWP Console</h1>
  <p>Enter the console password.</p>
  <p class="err" id="err" role="alert">That password is not right.</p>
  <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <button type="submit">Sign in</button>
</form>
<script>if (new URLSearchParams(location.search).has('error')) document.getElementById('err').classList.add('on');</script>
</body>
</html>
