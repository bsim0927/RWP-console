[project]
name = "rwp-console"
version = "0.1.0"
description = "RWP Console: screens fund data rooms against RWP's Manager Coverage gates."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.6.2",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

# ---------- ruff ----------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web/vendor", "rust"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit (security), SIM simplify.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "E501",  # ruff format owns line length; long regexes and strings are left whole
    "E731",  # lambda assignment is house style (server.py, sg/catalog.py)
    "S101",  # assert is fine in tests and invariants
    "S307",  # sg/pipeline.derive evals trusted, local gate config with no builtins, by design
    "S603",  # subprocess with a fixed argv (pdftohtml)
    "S607",  # pdftohtml is resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"e2e/**" = ["S"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
files = ["sg", "server.py", "screen.py", "catalog.py", "tests", "e2e/fixtures"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sg._verify"]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["sg"]
branch = true

[tool.coverage.report]
fail_under = 20  # ratchet: raise as tests are added, never lower
show_missing = true
skip_covered = true
